<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📋 Inventario Cafetería Provenza</title>
    <meta property="og:title" content="Inventario Cafetería Provenza">
    <meta property="og:description" content="App para gestionar el inventario de la cafetería Provenza">
    <meta property="og:type" content="website">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #FFC72C 0%, #008000 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #FFC72C 0%, #008000 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .header p {
            font-size: 14px;
            opacity: 0.95;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 3px solid #FFC72C;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            font-weight: 600;
            color: #666;
            transition: all 0.3s ease;
            border: none;
            background: transparent;
            font-size: 14px;
        }

        .tab:hover {
            background: #e0e0e0;
        }

        .tab.active {
            background: #FFC72C;
            color: white;
            border-bottom: 3px solid #008000;
        }

        .content {
            padding: 30px 20px;
            min-height: 400px;
        }

        .contador {
            text-align: center;
            color: #666;
            font-size: 12px;
            margin-bottom: 20px;
            padding: 10px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .contador strong {
            color: #008000;
            font-size: 14px;
        }

        .item-card {
            background: linear-gradient(135deg, #fffef0 0%, #f0f8f0 100%);
            border: 3px solid #FFC72C;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .item-card h2 {
            font-size: 28px;
            color: #008000;
            margin-bottom: 10px;
            font-weight: bold;
            word-wrap: break-word;
        }

        .stock-minimo {
            font-size: 12px;
            color: #999;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #008000;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #FFC72C;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            color: #333;
            background: white;
            transition: all 0.3s ease;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #008000;
            box-shadow: 0 0 10px rgba(0, 128, 0, 0.3);
            background: #fffef0;
        }

        .form-group select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23008000' stroke-width='2'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 10px center;
            background-size: 25px;
            padding-right: 40px;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn {
            flex: 1;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-guardar {
            background: linear-gradient(135deg, #FFC72C 0%, #ffb300 100%);
            color: #008000;
            box-shadow: 0 4px 15px rgba(255, 199, 44, 0.4);
        }

        .btn-guardar:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 199, 44, 0.6);
        }

        .btn-guardar:active {
            transform: translateY(0);
        }

        .btn-anterior {
            background: #e0e0e0;
            color: #666;
        }

        .btn-anterior:hover {
            background: #d0d0d0;
        }

        .btn-anterior:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mensaje {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #008000;
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .mensaje.error {
            background: #ff6b6b;
        }

        .auth-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #FFC72C 0%, #008000 100%);
        }

        .auth-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
        }

        .auth-box h1 {
            color: #008000;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .auth-box p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .auth-box select {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #FFC72C;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .auth-box button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #FFC72C 0%, #ffb300 100%);
            color: #008000;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .auth-box button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 199, 44, 0.6);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #008000;
        }

        .spinner {
            border: 4px solid #FFC72C;
            border-top: 4px solid #008000;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .item-card h2 {
                font-size: 24px;
            }

            .tab {
                font-size: 12px;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<div id="authScreen" class="auth-screen">
    <div class="auth-box">
        <h2 style="color: #FFC72C; font-size: 20px; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px;">CAFETERIA</h2>
        <h2 style="color: #008000; font-size: 20px; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px;">PROVENZA</h2>
        <h1>INVENTARIO</h1>
        <label style="color: #008000; font-weight: 600; margin-bottom: 10px; display: block;">¿Quién eres?</label>
        <select id="usuarioSelect">
            <option value="">-- Selecciona tu nombre --</option>
            <option value="EDWING">EDWING</option>
            <option value="CANDY">CANDY</option>
            <option value="JULI">JULI</option>
            <option value="CARLOS">CARLOS</option>
        </select>
        <button onclick="autenticar()">ENTRAR</button>
    </div>
</div>

<div id="appContainer" class="container" style="display: none;">
    <div class="header">
        <h1>CAFETERIA PROVENZA</h1>
        <p id="usuarioActual" style="margin-top: 8px;"></p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="cambiarTab('aseo')">● ASEO</button>
        <button class="tab" onclick="cambiarTab('produccion')">● PRODUCCIÓN</button>
        <button class="tab" onclick="cambiarTab('servicio')">● SERVICIO</button>
    </div>

    <div class="content">
        <div class="contador">
            Item <strong id="itemActual">1</strong> de <strong id="itemTotal">0</strong>
        </div>

        <div class="item-card">
            <h2 id="nombreItem">--</h2>
            <div class="stock-minimo">Stock Mínimo: <strong id="stockMinimo">--</strong></div>

            <div class="form-group">
                <label for="estadoSelect">Estado actual:</label>
                <select id="estadoSelect" onchange="actualizarVista()">
                    <option value="">-- Selecciona --</option>
                    <option value="BAJO">BAJO</option>
                    <option value="MEDIO">MEDIO</option>
                    <option value="ALTO">ALTO</option>
                    <option value="numero">Escribir número</option>
                </select>
            </div>

            <div id="inputNumeroDiv" class="form-group" style="display: none;">
                <label for="inputNumero">Cantidad:</label>
                <input type="number" id="inputNumero" placeholder="Ej: 5" min="0">
            </div>

            <div class="buttons">
                <button class="btn btn-anterior" id="btnAnterior" onclick="anterior()" disabled">← ANTERIOR</button>
                <button class="btn btn-guardar" onclick="guardar()">✓ GUARDAR</button>
            </div>

            <div id="btnEntrada" style="margin-top: 15px; display: none;">
                <div style="margin-bottom: 15px; padding: 15px; background: #f0f8f0; border-radius: 10px; border: 2px solid #4CAF50;">
                    <label style="display: block; font-weight: 600; color: #008000; margin-bottom: 10px; font-size: 14px;">Registrar Entrada Rápida:</label>
                    <select id="itemEntradaSelect" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #4CAF50; border-radius: 8px; font-weight: 600; color: #333;">
                        <option value="">-- Selecciona un item --</option>
                    </select>
                    <input type="number" id="cantidadEntrada" placeholder="Cantidad" min="1" style="width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #4CAF50; border-radius: 8px; font-weight: 600;">
                    <button style="width: 100%; padding: 12px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px;" onclick="registrarEntradaRapida()">✓ REGISTRAR ENTRADA</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const SHEET_ID = "15mOqPpJVWtgFKxU0Xto4RxaayQQtCThUZHUnUxEjhAs";
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx2EN4j8vzouoqST1Fo_v0r0rJd0x9_RoV2Y2OD1ZvLTy5aBAJFi3ow5Pj2YseCdJp2pQ/exec";

    let usuarioActual = null;
    let categoriaActual = "aseo";
    let indexActual = 0;
    let inventario = {
        aseo: [],
        produccion: [],
        servicio: []
    };

    window.addEventListener('load', () => {
        cargarDatos();
        cargarItemsDeSheets();
    });

    function autenticar() {
        usuarioActual = document.getElementById('usuarioSelect').value;
        if (!usuarioActual) {
            alert('Por favor selecciona tu nombre');
            return;
        }
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('appContainer').style.display = 'block';
        document.getElementById('usuarioActual').textContent = `Usuario: ${usuarioActual}`;
        mostrarItem();
    }

    function cargarDatos() {
        // Esta función ahora se sobrescribe con los datos de Sheets
        inventario.aseo = [];
        inventario.produccion = [];
        inventario.servicio = [];
    }

    function cargarItemsDeSheets() {
        // Usa la MISMA URL que SCRIPT_URL para obtener items
        // El doGet() devolverá automáticamente los items
        fetch(SCRIPT_URL)
            .then(response => response.json())
            .then(data => {
                // Verifica si tiene la estructura correcta
                if (data.aseo && data.produccion && data.servicio) {
                    inventario = data;
                    console.log('✅ Items cargados de Google Sheets');
                    
                    // Llenar dropdown después de cargar
                    setTimeout(() => {
                        llenarDropdownItems();
                    }, 500);
                } else {
                    console.log('Estructura incorrecta, usando datos locales');
                    cargarDatosLocal();
                    llenarDropdownItems();
                }
            })
            .catch(e => {
                console.log('Error cargando items:', e);
                cargarDatosLocal();
                llenarDropdownItems();
            });
    }

    function cargarDatosLocal() {
        // Datos por defecto si no se puede conectar a Sheets
        inventario.aseo = [
            { id: 1, nombre: "Aroma para pisos", stockMin: "BAJO" },
            { id: 2, nombre: "Bolsas de basura", stockMin: "BAJO" },
            { id: 3, nombre: "Brillos", stockMin: "BAJO" },
            { id: 4, nombre: "Esponjas", stockMin: "BAJO" },
            { id: 5, nombre: "Jabón de loza", stockMin: "BAJO" },
            { id: 6, nombre: "Jabón en polvo", stockMin: "BAJO" },
            { id: 7, nombre: "Jabón líquido para manos", stockMin: "BAJO" },
            { id: 8, nombre: "Limpiavidrios", stockMin: "BAJO" },
            { id: 9, nombre: "Límpido", stockMin: "BAJO" },
            { id: 10, nombre: "Quitagrasa", stockMin: "BAJO" }
        ];

        inventario.produccion = [
            { id: 11, nombre: "Aceite", stockMin: "BAJO" },
            { id: 12, nombre: "Aromática", stockMin: "BAJO" },
            { id: 13, nombre: "Azúcar", stockMin: "BAJO" },
            { id: 14, nombre: "Café", stockMin: "BAJO" },
            { id: 15, nombre: "Chamoy", stockMin: "BAJO" },
            { id: 16, nombre: "Chicles", stockMin: "BAJO" },
            { id: 17, nombre: "Colorante rojo", stockMin: "BAJO" },
            { id: 18, nombre: "Colorante verde", stockMin: "BAJO" },
            { id: 19, nombre: "Gomitas", stockMin: "BAJO" },
            { id: 20, nombre: "Huevos", stockMin: "BAJO" },
            { id: 21, nombre: "Leche", stockMin: "2" },
            { id: 22, nombre: "Maíz pira", stockMin: "BAJO" },
            { id: 23, nombre: "Pan", stockMin: "5" },
            { id: 24, nombre: "Papa francesa", stockMin: "10" },
            { id: 25, nombre: "Papa ripio", stockMin: "5" },
            { id: 26, nombre: "Pimienta", stockMin: "BAJO" },
            { id: 27, nombre: "Queso salado", stockMin: "BAJO" },
            { id: 28, nombre: "Saborizante rojo", stockMin: "BAJO" },
            { id: 29, nombre: "Saborizante verde", stockMin: "BAJO" },
            { id: 30, nombre: "Sal", stockMin: "BAJO" },
            { id: 31, nombre: "Salchichas", stockMin: "5" },
            { id: 32, nombre: "Salsa roja", stockMin: "BAJO" },
            { id: 33, nombre: "Salsa rosada", stockMin: "BAJO" }
        ];

        inventario.servicio = [
            { id: 34, nombre: "Bandejas", stockMin: "BAJO" },
            { id: 35, nombre: "Bolsa de papel", stockMin: "BAJO" },
            { id: 36, nombre: "Bolsas para ají", stockMin: "BAJO" },
            { id: 37, nombre: "Bolsas para mango", stockMin: "BAJO" },
            { id: 38, nombre: "Guantes de nitrilo", stockMin: "BAJO" },
            { id: 39, nombre: "Guantes plásticos", stockMin: "BAJO" },
            { id: 40, nombre: "Mezcladores", stockMin: "BAJO" },
            { id: 41, nombre: "Palillos", stockMin: "BAJO" },
            { id: 42, nombre: "Red de cabello", stockMin: "BAJO" },
            { id: 43, nombre: "Servilletas", stockMin: "BAJO" },
            { id: 44, nombre: "Tapabocas", stockMin: "BAJO" },
            { id: 45, nombre: "Vaso tinto", stockMin: "BAJO" },
            { id: 46, nombre: "Vaso 5 oz", stockMin: "BAJO" },
            { id: 47, nombre: "Vaso 7 oz", stockMin: "BAJO" },
            { id: 48, nombre: "Vaso 9 oz", stockMin: "BAJO" },
            { id: 49, nombre: "Vaso 12 oz", stockMin: "BAJO" }
        ];
    }

    function cambiarTab(categoria) {
        categoriaActual = categoria;
        indexActual = 0;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        event.target.classList.add('active');
        mostrarItem();
    }

    function mostrarItem() {
        const items = inventario[categoriaActual];
        const item = items[indexActual];

        document.getElementById('itemActual').textContent = indexActual + 1;
        document.getElementById('itemTotal').textContent = items.length;
        document.getElementById('nombreItem').textContent = item.nombre;
        document.getElementById('stockMinimo').textContent = item.stockMin;
        document.getElementById('estadoSelect').value = '';
        document.getElementById('inputNumero').value = '';
        document.getElementById('inputNumeroDiv').style.display = 'none';

        document.getElementById('btnAnterior').disabled = indexActual === 0;

        // Mostrar botón de entrada solo para EDWING y CARLOS
        if (['EDWING', 'CARLOS'].includes(usuarioActual)) {
            document.getElementById('btnEntrada').style.display = 'block';
            // Llenar dropdown con items de la categoría actual
            llenarDropdownItems();
        } else {
            document.getElementById('btnEntrada').style.display = 'none';
        }
    }

    function llenarDropdownItems() {
        const select = document.getElementById('itemEntradaSelect');
        
        // Limpiar opciones previas (excepto la primera)
        while (select.options.length > 1) {
            select.remove(1);
        }
        
        // Agregar SOLO los items de la categoría actual
        const itemsCategoria = inventario[categoriaActual];
        
        itemsCategoria.forEach(item => {
            const option = document.createElement('option');
            option.value = item.id;
            option.textContent = `[${item.id}] ${item.nombre}`;
            select.appendChild(option);
        });
        
        console.log(`✅ Dropdown lleno con ${itemsCategoria.length} items de ${categoriaActual.toUpperCase()}`);
    }

    function registrarEntradaRapida() {
        const itemId = document.getElementById('itemEntradaSelect').value;
        const cantidad = document.getElementById('cantidadEntrada').value;
        
        if (!itemId) {
            mostrarMensaje('Selecciona un item', 'error');
            return;
        }
        
        if (!cantidad || cantidad <= 0) {
            mostrarMensaje('Ingresa una cantidad válida', 'error');
            return;
        }
        
        enviarEntradaASheets(parseInt(itemId), cantidad);
        mostrarMensaje(`✅ Entrada de ${cantidad} registrada`);
        
        // Limpiar campos
        document.getElementById('itemEntradaSelect').value = '';
        document.getElementById('cantidadEntrada').value = '';
    }

    function actualizarVista() {
        const estado = document.getElementById('estadoSelect').value;
        if (estado === 'numero') {
            document.getElementById('inputNumeroDiv').style.display = 'block';
        } else {
            document.getElementById('inputNumeroDiv').style.display = 'none';
        }
    }

    function anterior() {
        if (indexActual > 0) {
            indexActual--;
            mostrarItem();
        }
    }

    function guardar() {
        const estado = document.getElementById('estadoSelect').value;
        if (!estado) {
            mostrarMensaje('Por favor selecciona un estado', 'error');
            return;
        }

        let nivelFinal = estado;
        if (estado === 'numero') {
            const numero = document.getElementById('inputNumero').value;
            if (!numero) {
                mostrarMensaje('Por favor escribe la cantidad', 'error');
                return;
            }
            nivelFinal = numero;
        }

        const items = inventario[categoriaActual];
        const item = items[indexActual];

        // Enviar a Google Sheets
        enviarASheets(item.id, nivelFinal);

        mostrarMensaje('✅ ¡Guardado!');

        // Auto siguiente en 1 segundo
        setTimeout(() => {
            if (indexActual < items.length - 1) {
                indexActual++;
                mostrarItem();
            } else {
                mostrarMensaje('🎉 ¡Categoría completada!');
            }
        }, 1000);
    }

    function registrarEntrada() {
        const numero = prompt('¿Cuántas unidades ingresan?');
        if (numero && numero > 0) {
            const items = inventario[categoriaActual];
            const item = items[indexActual];
            enviarEntradaASheets(item.id, numero);
            mostrarMensaje(`✅ Entrada de ${numero} registrada`);
        }
    }

    function enviarASheets(id, nivel) {
        const ahora = new Date();
        const fechaHora = ahora.toLocaleString('es-CO');

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
                accion: 'actualizar',
                id: id,
                nivel: nivel,
                fechaHora: fechaHora,
                realizadoPor: usuarioActual
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log('✅ Sincronizado:', data);
        })
        .catch(e => console.log('Error sync:', e));
    }

    function enviarEntradaASheets(id, cantidad) {
        const ahora = new Date();
        const fechaHora = ahora.toLocaleString('es-CO');

        fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify({
                accion: 'entrada',
                id: id,
                cantidad: cantidad,
                fechaHora: fechaHora,
                realizadoPor: usuarioActual
            })
        })
        .then(response => response.json())
        .then(data => {
            console.log('✅ Entrada sincronizada:', data);
        })
        .catch(e => console.log('Error entrada:', e));
    }

    function mostrarMensaje(texto, tipo = 'success') {
        const msg = document.createElement('div');
        msg.className = 'mensaje' + (tipo === 'error' ? ' error' : '');
        msg.textContent = texto;
        document.body.appendChild(msg);

        setTimeout(() => msg.remove(), 2000);
    }
</script>

</body>
</html>
